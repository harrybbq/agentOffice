<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' theme: data: blob:; connect-src 'self' theme:; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>Agent Office</title>
    <style>
      :root {
        color-scheme: dark;
        --panel: rgba(20, 22, 32, 0.82);
        --text: #f4f1ea;
        --dim: #a9a6b8;
        --accent: #f6e05e;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #1b1c28;
        font: 12px/1.35 ui-monospace, 'Cascadia Mono', Consolas, monospace;
        color: var(--text);
      }
      body.overlay {
        background: transparent;
      }
      #game {
        position: absolute;
        inset: 0;
      }
      #hud {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }
      .hud-left {
        position: absolute;
        bottom: 8px;
        left: 8px;
        display: flex;
        flex-direction: column;
        gap: 6px;
        max-width: 280px;
      }
      .hud-panel {
        background: var(--panel);
        border-radius: 6px;
        padding: 6px 8px;
      }
      .hud-panel[hidden] {
        display: none;
      }
      .hud-waiting {
        border-left: 3px solid var(--accent);
      }
      .hud-waiting h2 {
        margin: 0 0 4px;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--accent);
      }
      .hud-waiting ul {
        list-style: none;
        margin: 0;
        padding: 0;
      }
      .hud-waiting li + li {
        margin-top: 4px;
      }
      .hud-ago {
        float: right;
        color: var(--dim);
        margin-left: 8px;
      }
      .hud-detail {
        color: var(--dim);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hud-legend {
        pointer-events: auto;
      }
      .hud-team {
        cursor: pointer;
        border-radius: 3px;
        padding: 1px 2px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .hud-team:hover {
        background: rgba(255, 255, 255, 0.08);
      }
      .hud-swatch {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.5);
      }
      .hud-info {
        position: absolute;
        bottom: 8px;
        right: 8px;
        text-align: right;
      }
      .hud-dim {
        color: var(--dim);
      }
      .hud-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        border: 1px solid rgba(0, 0, 0, 0.5);
        margin-left: -3px;
      }
      .hud-wgroup {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 4px 0 2px;
        color: var(--dim);
        font-size: 11px;
      }
      .hud-waiting ul {
        padding-left: 16px;
      }
      /* CEO speech bar */
      .hud-bar {
        position: absolute;
        bottom: 8px;
        left: 50%;
        transform: translateX(-50%);
        width: clamp(280px, calc(100vw - 520px), 560px);
        pointer-events: auto;
        border-left: 3px solid #c0392b;
        box-sizing: border-box;
        margin: 0;
      }
      .hud-bar-row {
        display: flex;
        gap: 6px;
        align-items: center;
      }
      .hud-bar-label {
        font-weight: bold;
        color: #f2a097;
        letter-spacing: 0.06em;
      }
      .hud-target,
      .hud-input,
      .hud-send {
        font: inherit;
        color: var(--text);
        background: rgba(255, 255, 255, 0.07);
        border: 1px solid rgba(255, 255, 255, 0.18);
        border-radius: 4px;
        padding: 3px 6px;
      }
      .hud-target {
        max-width: 140px;
      }
      .hud-target option {
        background: #202230;
      }
      .hud-input {
        flex: 1;
        min-width: 0;
      }
      .hud-input:focus,
      .hud-target:focus {
        outline: 1px solid var(--accent);
      }
      .hud-send {
        cursor: pointer;
        background: #8e2b20;
        border-color: #c0392b;
      }
      .hud-send:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .hud-toast {
        margin-bottom: 5px;
        padding: 3px 6px;
        border-radius: 4px;
        background: rgba(217, 83, 79, 0.25);
        color: #ffd7d4;
        word-break: break-word;
      }
      .hud-toast-ok {
        background: rgba(76, 175, 80, 0.25);
        color: #d6f5d8;
      }
      .hud-toast[hidden] {
        display: none;
      }
      /* PA banner + office-wide indicator */
      .hud-top {
        position: absolute;
        top: 8px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        max-width: calc(100vw - 32px);
      }
      .hud-banner {
        background: #f6e05e;
        color: #1e1e24;
        font-weight: bold;
        padding: 6px 14px;
        border-radius: 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        max-width: 720px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .hud-banner-in {
        animation: hud-drop 0.35s ease-out;
      }
      @keyframes hud-drop {
        from {
          transform: translateY(-30px);
          opacity: 0;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      .hud-wide {
        pointer-events: auto;
        cursor: pointer;
        font: inherit;
        color: #1e1e24;
        background: #7ed6a5;
        border: 1px solid #2e7d4f;
        border-radius: 12px;
        padding: 3px 12px;
      }
      .hud-banner[hidden],
      .hud-wide[hidden] {
        display: none;
      }
      body.overlay .hud-legend,
      body.overlay .hud-info,
      body.overlay .hud-bar,
      body.overlay .hud-wide {
        display: none;
      }
      #error {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        max-width: 520px;
        padding: 14px 18px;
        background: #3b1f24;
        border: 1px solid #d9534f;
        border-radius: 6px;
        white-space: pre-wrap;
      }
      #error[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="hud"></div>
    <div id="error" role="alert" hidden></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
